<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nexora AI Studio — Form Definitions</title>
  </head>
  <body>
    <!--
      Static form skeletons used only for Netlify deploy-time form detection.
      Field names MUST match exactly what the React forms submit.
      This page is never shown to users.
    -->
    <form name="consultation-booking" method="POST" action="/__forms.html" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="consultation-booking" />
      <input type="text" name="bot-field" />
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="text" name="businessName" />
      <input type="text" name="country" />
      <input type="text" name="whatsapp" />
      <input type="text" name="topic" />
      <input type="text" name="preferredDate" />
      <input type="text" name="preferredTime" />
      <input type="text" name="timezone" />
      <textarea name="notes"></textarea>
    </form>

    <form name="project-inquiry" method="POST" action="/__forms.html" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="project-inquiry" />
      <input type="text" name="bot-field" />
      <input type="text" name="fullName" />
      <input type="text" name="businessName" />
      <input type="email" name="email" />
      <input type="text" name="whatsapp" />
      <input type="text" name="country" />
      <input type="text" name="contactMethod" />
      <input type="text" name="businessType" />
      <input type="text" name="businessWebsiteStatus" />
      <textarea name="businessDescription"></textarea>
      <input type="checkbox" name="services[]" value="Professional Website Development" />
      <input type="checkbox" name="services[]" value="Website Redesign" />
      <input type="checkbox" name="services[]" value="AI Chatbot Development" />
      <input type="checkbox" name="services[]" value="WhatsApp AI Assistant" />
      <input type="checkbox" name="services[]" value="Customer Support Automation" />
      <input type="checkbox" name="services[]" value="Lead Generation Automation" />
      <input type="checkbox" name="services[]" value="Business Workflow Automation" />
      <input type="checkbox" name="services[]" value="Custom AI Tool Development" />
      <input type="checkbox" name="services[]" value="AI Integration" />
      <input type="checkbox" name="services[]" value="API Integration" />
      <input type="checkbox" name="services[]" value="E-commerce Automation" />
      <input type="checkbox" name="services[]" value="Other" />
      <input type="text" name="otherService" />
      <input type="text" name="websiteType" />
      <input type="text" name="chatbotType" />
      <input type="text" name="automationType" />
      <input type="text" name="customToolType" />
      <textarea name="projectDetails"></textarea>
      <input type="text" name="existingTools" />
      <input type="text" name="requiredIntegrations" />
      <input type="text" name="referenceWebsites" />
      <input type="text" name="budget" />
      <input type="text" name="timeline" />
      <input type="text" name="privacyAccepted" />
    </form>
  </body>
</html>
